<!doctype html>
<html lang="zh-Hant-TW">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>⚙️ Lightning Talk Settings - SITCON 2026</title>
		<script src="/socket.io/socket.io.js"></script>
		<meta name="theme-color" content="#010121" />
		<link rel="icon" type="image/png" href="/icon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/icon/favicon.svg" />
		<link rel="shortcut icon" href="/icon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="SITCON 2026 閃電講" />
		<link rel="manifest" href="/icon/site.webmanifest" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
				background: linear-gradient(135deg, #835403 0%, #0a0600 100%);
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: flex-start;
				padding: 20px;
				color: #f0d080;
			}

			/* ── Login ──────────────────────────────────────────────── */

			#login-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				background: linear-gradient(135deg, #6f4803 0%, #0a0600 100%);
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 10000;
			}

			#login-screen.hidden {
				display: none;
			}

			.login-box {
				background: linear-gradient(160deg, #1c1200 0%, #2a1d00 100%);
				border: 1px solid #a07820;
				padding: 40px;
				border-radius: 16px;
				box-shadow:
					0 10px 40px rgba(0, 0, 0, 0.6),
					0 0 60px rgba(200, 140, 20, 0.08);
				text-align: center;
				width: 360px;
			}

			.login-box h1 {
				margin-bottom: 24px;
				color: #e8a53e;
				font-size: 1.5rem;
				letter-spacing: 0.05em;
			}

			.login-box input {
				width: 100%;
				padding: 12px 16px;
				border: 1.5px solid #6b4a10;
				border-radius: 8px;
				font-size: 16px;
				margin-bottom: 15px;
				background: rgba(0, 0, 0, 0.4);
				color: #f0d080;
				outline: none;
				transition: border-color 0.2s;
			}

			.login-box input:focus {
				border-color: #e8a53e;
			}

			.login-box button {
				width: 100%;
				padding: 12px;
				background: linear-gradient(135deg, #b87320 0%, #e8a53e 100%);
				color: #010121;
				border: none;
				border-radius: 8px;
				font-size: 16px;
				font-weight: 700;
				cursor: pointer;
				transition:
					opacity 0.2s,
					transform 0.1s;
			}

			.login-box button:hover {
				opacity: 0.9;
				transform: translateY(-1px);
			}

			.error {
				color: #ff7060;
				margin-top: 10px;
				font-size: 0.9em;
			}

			/* ── Layout ─────────────────────────────────────────────── */

			#main-layout {
				display: flex;
				gap: 20px;
				width: 100%;
				max-width: 900px;
				align-items: flex-start;
			}

			/* ── Control Panel (left) ───────────────────────────────── */

			#control-panel {
				background: linear-gradient(160deg, #1c1200 0%, #2a1d00 100%);
				border: 1px solid #6b4a10;
				padding: 24px;
				border-radius: 16px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
				width: 340px;
				flex-shrink: 0;
			}

			#control-panel h2 {
				margin-bottom: 16px;
				color: #e8a53e;
				font-size: 1.1rem;
				letter-spacing: 0.05em;
				border-bottom: 1px solid #4a3008;
				padding-bottom: 12px;
			}

			.control-group {
				margin-bottom: 16px;
			}

			.control-group label {
				display: block;
				margin-bottom: 6px;
				color: #c8a060;
				font-size: 13px;
				font-weight: 500;
			}

			.control-group input[type="range"] {
				width: 100%;
				accent-color: #e8a53e;
			}

			.control-group input[type="number"] {
				width: 100%;
				padding: 8px 12px;
				border: 1.5px solid #6b4a10;
				border-radius: 8px;
				font-size: 14px;
				background: rgba(0, 0, 0, 0.35);
				color: #f0d080;
				outline: none;
				transition: border-color 0.2s;
			}

			.control-group input[type="number"]:focus {
				border-color: #e8a53e;
			}

			.control-group .value-display {
				display: inline-block;
				margin-left: 10px;
				color: #e8a53e;
				font-weight: bold;
			}

			.control-group button {
				width: 100%;
				padding: 10px;
				border: none;
				border-radius: 8px;
				font-size: 14px;
				cursor: pointer;
				transition: all 0.2s;
				font-weight: 600;
				margin-top: 6px;
			}

			.btn-primary {
				background: linear-gradient(135deg, #7a5010 0%, #c8820a 100%);
				color: #fde8a0;
			}

			.btn-primary:hover {
				opacity: 0.9;
				transform: translateY(-1px);
			}

			.btn-success {
				background: linear-gradient(135deg, #1a6b2a 0%, #27ae60 100%);
				color: white;
			}

			.btn-success:hover {
				opacity: 0.9;
				transform: translateY(-1px);
			}

			.btn-danger {
				background: linear-gradient(135deg, #8b1a1a 0%, #e74c3c 100%);
				color: white;
			}

			.btn-danger:hover {
				opacity: 0.9;
				transform: translateY(-1px);
			}

			.btn-active {
				background: linear-gradient(135deg, #8b1a1a 0%, #e74c3c 100%);
				color: white;
			}

			#status-bar {
				background: rgba(0, 0, 0, 0.4);
				border: 1px solid #4a3008;
				color: #c8a060;
				padding: 10px 14px;
				border-radius: 8px;
				font-size: 13px;
				margin-bottom: 16px;
			}

			#status-bar div {
				margin: 3px 0;
			}

			#status-bar strong {
				color: #e8a53e;
			}

			/* ── Stats Panel (right) ────────────────────────────────── */

			#stats-panel {
				flex: 1;
				min-width: 0;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}

			.stats-header {
				background: linear-gradient(160deg, #1c1200 0%, #2a1d00 100%);
				border: 1px solid #6b4a10;
				padding: 20px 24px;
				border-radius: 16px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
			}

			.stats-header h2 {
				color: #e8a53e;
				font-size: 1.1rem;
				letter-spacing: 0.05em;
				margin-bottom: 16px;
				border-bottom: 1px solid #4a3008;
				padding-bottom: 12px;
			}

			.stats-numbers {
				display: flex;
				gap: 16px;
			}

			.stat-card {
				flex: 1;
				background: rgba(0, 0, 0, 0.35);
				border: 1px solid #4a3008;
				border-radius: 12px;
				padding: 16px;
				text-align: center;
			}

			.stat-card .stat-label {
				font-size: 12px;
				color: #9a7840;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				margin-bottom: 8px;
			}

			.stat-card .stat-value {
				font-size: 2.8rem;
				font-weight: 800;
				line-height: 1;
				background: linear-gradient(135deg, #e8a53e 0%, #fde080 60%, #c87820 100%);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
				letter-spacing: -0.02em;
			}

			.stat-card .stat-sub {
				font-size: 11px;
				color: #6b4a10;
				margin-top: 6px;
			}

			/* ── Chart ──────────────────────────────────────────────── */

			.chart-container {
				background: linear-gradient(160deg, #1c1200 0%, #2a1d00 100%);
				border: 1px solid #6b4a10;
				padding: 20px 24px;
				border-radius: 16px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
			}

			.chart-container h3 {
				color: #e8a53e;
				font-size: 0.95rem;
				letter-spacing: 0.05em;
				margin-bottom: 14px;
			}

			.chart-legend {
				display: flex;
				gap: 20px;
				margin-bottom: 12px;
				font-size: 12px;
			}

			.legend-item {
				display: flex;
				align-items: center;
				gap: 6px;
				color: #9a7840;
			}

			.legend-dot {
				width: 10px;
				height: 10px;
				border-radius: 50%;
			}

			.legend-dot.online {
				background: #e8a53e;
				box-shadow: 0 0 6px rgba(232, 165, 62, 0.6);
			}

			.legend-dot.unique {
				background: #60c8e0;
				box-shadow: 0 0 6px rgba(96, 200, 224, 0.5);
			}

			canvas#stats-chart {
				width: 100%;
				display: block;
				border-radius: 8px;
			}

			/* ── Divider in control panel ───────────────────────────── */

			.section-divider {
				border: none;
				border-top: 1px solid #3a2506;
				margin: 12px 0;
			}
		</style>

	</head>
	<body>
		<div id="login-screen">
			<div class="login-box">
				<h1>管理員登入</h1>
				<input type="password" id="password-input" placeholder="輸入管理員密碼" />
				<button id="login-btn">登入</button>
				<div id="login-error" class="error"></div>
			</div>
		</div>

		<div id="main-layout">
			<!-- Left: Control Panel -->
			<div id="control-panel">
				<h2>控制面板</h2>

				<div id="status-bar">
					<div>
						<strong>狀態：</strong>
						<span id="status">Ready</span>
					</div>
				</div>

				<div class="control-group">
					<label>
						地球引力強度：
						<span class="value-display" id="gravity-value">1.0</span>
					</label>
					<input type="range" id="gravity" min="0" max="5" step="0.1" value="1" />
				</div>

				<div class="control-group">
					<label>
						彈力係數：
						<span class="value-display" id="elasticity-value">0.8</span>
					</label>
					<input type="range" id="elasticity" min="0" max="1" step="0.05" value="0.8" />
				</div>

				<hr class="section-divider" />

				<div class="control-group">
					<label>倒數計時器 (秒)</label>
					<input type="number" id="countdown-seconds" min="1" max="3600" value="60" />
					<button id="start-countdown-btn" class="btn-primary">開始倒數</button>
				</div>

				<div class="control-group">
					<button id="toggle-dropping" class="btn-success">立即開放投球</button>
				</div>

				<div class="control-group">
					<button id="reset-world-btn" class="btn-danger">清空球</button>
				</div>

				<hr class="section-divider" />

				<div class="control-group">
					<label>倒數結束後自動填充 (秒)</label>
					<input type="number" id="autofill-seconds" min="0" max="60" value="5" />
				</div>

				<div class="control-group">
					<button id="force-autofill-btn" class="btn-primary">強制立即填滿</button>
				</div>
			</div>

			<!-- Right: Stats Panel -->
			<div id="stats-panel">
				<div class="stats-header">
					<h2>即時人數統計</h2>
					<div class="stats-numbers">
						<div class="stat-card">
							<div class="stat-label">即時在線</div>
							<div class="stat-value" id="stat-online">0</div>
							<div class="stat-sub">目前連線中</div>
						</div>
						<div class="stat-card">
							<div class="stat-label">不重複用戶</div>
							<div class="stat-value" id="stat-unique">0</div>
							<div class="stat-sub">累計 Email 數</div>
						</div>
					</div>
				</div>

				<div class="chart-container">
					<h3>人數變化曲線</h3>
					<div class="chart-legend">
						<div class="legend-item">
							<div class="legend-dot online"></div>
							<span>即時在線</span>
						</div>
						<div class="legend-item">
							<div class="legend-dot unique"></div>
							<span>不重複用戶</span>
						</div>
					</div>
					<canvas id="stats-chart" height="220"></canvas>
				</div>
			</div>
		</div>

		<script>
			const socket = io();

			let isDropping = false;
			let countdownInterval = null;
			let autoFillTimeout = null;

			const clearCountdownInterval = () => {
				if (!countdownInterval) return;
				clearInterval(countdownInterval);
				countdownInterval = null;
			};

			const clearAutoFillTimeout = () => {
				if (!autoFillTimeout) return;
				clearTimeout(autoFillTimeout);
				autoFillTimeout = null;
			};

			// ── Login ────────────────────────────────────────────────────────────
			const login = () => {
				const password = document.getElementById("password-input").value;
				socket.emit("admin:login", { password });
			};

			document.getElementById("login-btn").addEventListener("click", login);
			document.getElementById("password-input").addEventListener("keypress", e => {
				if (e.key === "Enter") login();
			});

			socket.on("admin:authenticated", data => {
				if (data.success) {
					document.getElementById("login-screen").classList.add("hidden");
				} else {
					document.getElementById("login-error").textContent = "Invalid password";
				}
			});

			// ── Physics controls ─────────────────────────────────────────────────
			document.getElementById("gravity").addEventListener("input", e => {
				const value = parseFloat(e.target.value);
				document.getElementById("gravity-value").textContent = value.toFixed(1);
				socket.emit("admin:updatePhysics", { gravity: value });
			});

			document.getElementById("elasticity").addEventListener("input", e => {
				const value = parseFloat(e.target.value);
				document.getElementById("elasticity-value").textContent = value.toFixed(2);
				socket.emit("admin:updatePhysics", { elasticity: value });
			});

			const toggleDropping = () => {
				isDropping = !isDropping;
				const btn = document.getElementById("toggle-dropping");

				if (isDropping) {
					btn.textContent = "停止丟球";
					btn.classList.remove("btn-success");
					btn.classList.add("btn-active");
					document.getElementById("status").textContent = "丟球中";
				} else {
					btn.textContent = "允許丟球";
					btn.classList.remove("btn-active");
					btn.classList.add("btn-success");
					document.getElementById("status").textContent = "目前禁止丟球";
				}

				socket.emit("admin:toggleDropping", { dropping: isDropping });
			};

			document.getElementById("toggle-dropping").addEventListener("click", toggleDropping);

			const startCountdown = () => {
				const seconds = parseInt(document.getElementById("countdown-seconds").value);
				if (seconds > 0 && seconds <= 3600) {
					clearCountdownInterval();
					clearAutoFillTimeout();
					socket.emit("admin:startCountdown", { seconds });
					document.getElementById("status").textContent = `Countdown: ${seconds}s`;
				}
			};

			document.getElementById("start-countdown-btn").addEventListener("click", startCountdown);

			const resetWorld = () => {
				if (confirm("This will remove the floor and all balls will fall. Continue?")) {
					socket.emit("admin:reset");
				}
			};

			document.getElementById("reset-world-btn").addEventListener("click", resetWorld);

			const forceAutoFill = () => {
				socket.emit("admin:forceAutoFill");
			};

			document.getElementById("force-autofill-btn").addEventListener("click", forceAutoFill);

			// ── Socket events ────────────────────────────────────────────────────
			socket.on("physics:update", settings => {
				if (settings.gravity !== undefined) {
					document.getElementById("gravity").value = settings.gravity;
					document.getElementById("gravity-value").textContent = settings.gravity.toFixed(1);
				}

				if (settings.elasticity !== undefined) {
					document.getElementById("elasticity").value = settings.elasticity;
					document.getElementById("elasticity-value").textContent = settings.elasticity.toFixed(2);
				}
			});

			socket.on("dropping:changed", data => {
				isDropping = data.dropping;
				const btn = document.getElementById("toggle-dropping");

				if (isDropping) {
					btn.textContent = "停止丟球";
					btn.classList.remove("btn-success");
					btn.classList.add("btn-active");
					document.getElementById("status").textContent = "丟球中";
				} else {
					btn.textContent = "允許丟球";
					btn.classList.remove("btn-active");
					btn.classList.add("btn-success");
					document.getElementById("status").textContent = "目前禁止丟球";
				}
			});

			socket.on("countdown:start", data => {
				clearCountdownInterval();
				clearAutoFillTimeout();
				let remaining = data.seconds;
				document.getElementById("status").textContent = `Countdown: ${remaining}s`;

				countdownInterval = setInterval(() => {
					remaining--;
					if (remaining <= 0) {
						clearCountdownInterval();
						document.getElementById("status").textContent = "Countdown Ended";
					} else {
						document.getElementById("status").textContent = `Countdown: ${remaining}s`;
					}
				}, 1000);
			});

			socket.on("countdown:end", () => {
				clearCountdownInterval();
				clearAutoFillTimeout();
				document.getElementById("status").textContent = "Countdown Ended";

				const autoFillDelay = parseInt(document.getElementById("autofill-seconds").value);
				if (autoFillDelay >= 0) {
					if (autoFillDelay === 0) {
						socket.emit("admin:forceAutoFill");
					} else {
						document.getElementById("status").textContent = `Auto-fill in ${autoFillDelay}s...`;
						autoFillTimeout = setTimeout(() => {
							autoFillTimeout = null;
							socket.emit("admin:forceAutoFill");
						}, autoFillDelay * 1000);
					}
				}
			});

			socket.on("countdown:cancel", () => {
				clearCountdownInterval();
				clearAutoFillTimeout();
			});

			// ── Stats & Chart ─────────────────────────────────────────────────────

			// History: { time, online, unique }[]  (up to MAX_POINTS entries)
			const MAX_POINTS = 120;
			const history = [];

			const addDataPoint = (online, unique) => {
				history.push({ time: Date.now(), online, unique });
				if (history.length > MAX_POINTS) history.shift();
			};

			socket.on("admin:stats", data => {
				document.getElementById("stat-online").textContent = data.online;
				document.getElementById("stat-unique").textContent = data.unique;
				addDataPoint(data.online, data.unique);
				drawChart();
			});

			// ── Canvas Chart ──────────────────────────────────────────────────────

			const canvas = document.getElementById("stats-chart");
			const ctx = canvas.getContext("2d");

			// Resize canvas to match CSS width
			const resizeCanvas = () => {
				const rect = canvas.getBoundingClientRect();
				const dpr = window.devicePixelRatio || 1;
				canvas.width = rect.width * dpr;
				canvas.height = canvas.height || 220 * dpr;
				ctx.scale(dpr, dpr);
				drawChart();
			};

			const drawChart = () => {
				const W = canvas.getBoundingClientRect().width;
				const H = 220;
				const dpr = window.devicePixelRatio || 1;
				canvas.width = W * dpr;
				canvas.height = H * dpr;
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

				const PAD = { top: 16, right: 16, bottom: 32, left: 40 };
				const plotW = W - PAD.left - PAD.right;
				const plotH = H - PAD.top - PAD.bottom;

				// Background
				ctx.fillStyle = "rgba(0,0,0,0.3)";
				ctx.beginPath();
				ctx.roundRect(0, 0, W, H, 8);
				ctx.fill();

				if (history.length < 2) {
					ctx.fillStyle = "rgba(200,160,96,0.3)";
					ctx.font = "13px system-ui, sans-serif";
					ctx.textAlign = "center";
					ctx.textBaseline = "middle";
					ctx.fillText("等待資料中...", W / 2, H / 2);
					return;
				}

				// Compute Y range
				const maxVal = Math.max(...history.map(d => Math.max(d.online, d.unique)), 1);
				const yMax = Math.ceil(maxVal * 1.15) || 1;

				// Grid lines
				const gridCount = 4;
				ctx.strokeStyle = "rgba(100,72,16,0.4)";
				ctx.lineWidth = 1;
				for (let i = 0; i <= gridCount; i++) {
					const y = PAD.top + plotH - (i / gridCount) * plotH;
					ctx.beginPath();
					ctx.moveTo(PAD.left, y);
					ctx.lineTo(PAD.left + plotW, y);
					ctx.stroke();

					// Y labels
					const label = Math.round((i / gridCount) * yMax);
					ctx.fillStyle = "rgba(180,140,60,0.7)";
					ctx.font = "11px system-ui, sans-serif";
					ctx.textAlign = "right";
					ctx.textBaseline = "middle";
					ctx.fillText(label, PAD.left - 6, y);
				}

				// X axis ticks (time labels — show start and end)
				const tStart = history[0].time;
				const tEnd = history[history.length - 1].time;
				const fmtTime = ts => {
					const d = new Date(ts);
					return `${d.getHours().toString().padStart(2, "0")}:${d.getMinutes().toString().padStart(2, "0")}:${d.getSeconds().toString().padStart(2, "0")}`;
				};

				ctx.fillStyle = "rgba(180,140,60,0.6)";
				ctx.font = "10px system-ui, sans-serif";
				ctx.textAlign = "left";
				ctx.textBaseline = "top";
				ctx.fillText(fmtTime(tStart), PAD.left, H - PAD.bottom + 6);
				ctx.textAlign = "right";
				ctx.fillText(fmtTime(tEnd), PAD.left + plotW, H - PAD.bottom + 6);

				// Helper: map data point index to canvas coordinates
				const xOf = i => PAD.left + (i / (history.length - 1)) * plotW;
				const yOf = v => PAD.top + plotH - (v / yMax) * plotH;

				// ── Draw area fill then line ──────────────────────────────────────

				const drawSeries = (key, lineColor, fillColor) => {
					// Area fill
					ctx.beginPath();
					ctx.moveTo(xOf(0), yOf(history[0][key]));
					for (let i = 1; i < history.length; i++) {
						const x0 = xOf(i - 1),
							y0 = yOf(history[i - 1][key]);
						const x1 = xOf(i),
							y1 = yOf(history[i][key]);
						const cpx = (x0 + x1) / 2;
						ctx.bezierCurveTo(cpx, y0, cpx, y1, x1, y1);
					}
					ctx.lineTo(xOf(history.length - 1), PAD.top + plotH);
					ctx.lineTo(xOf(0), PAD.top + plotH);
					ctx.closePath();
					ctx.fillStyle = fillColor;
					ctx.fill();

					// Line
					ctx.beginPath();
					ctx.moveTo(xOf(0), yOf(history[0][key]));
					for (let i = 1; i < history.length; i++) {
						const x0 = xOf(i - 1),
							y0 = yOf(history[i - 1][key]);
						const x1 = xOf(i),
							y1 = yOf(history[i][key]);
						const cpx = (x0 + x1) / 2;
						ctx.bezierCurveTo(cpx, y0, cpx, y1, x1, y1);
					}
					ctx.strokeStyle = lineColor;
					ctx.lineWidth = 2.5;
					ctx.lineJoin = "round";
					ctx.stroke();

					// Dot at latest point
					const lx = xOf(history.length - 1);
					const ly = yOf(history[history.length - 1][key]);
					ctx.beginPath();
					ctx.arc(lx, ly, 4, 0, Math.PI * 2);
					ctx.fillStyle = lineColor;
					ctx.fill();
				};

				drawSeries("unique", "#60c8e0", "rgba(96,200,224,0.10)");
				drawSeries("online", "#e8a53e", "rgba(232,165,62,0.15)");

				// Axis borders
				ctx.strokeStyle = "rgba(100,72,16,0.6)";
				ctx.lineWidth = 1;
				ctx.beginPath();
				ctx.moveTo(PAD.left, PAD.top);
				ctx.lineTo(PAD.left, PAD.top + plotH);
				ctx.lineTo(PAD.left + plotW, PAD.top + plotH);
				ctx.stroke();
			};

			window.addEventListener("resize", drawChart);
			drawChart();
		</script>
