<!doctype html>
<html lang="zh-Hant-TW">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>⚙️ Lightning Talk Settings - SITCON 2026</title>
		<script src="/socket.io/socket.io.js"></script>
		<meta name="theme-color" content="#010121" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
				background-color: #010121;
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: flex-start;
				padding: 20px;
			}

			#login-screen {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				background: rgba(0, 0, 0, 0.9);
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 10000;
			}

			#login-screen.hidden {
				display: none;
			}

			.login-box {
				background: white;
				padding: 40px;
				border-radius: 12px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
				text-align: center;
			}

			.login-box h1 {
				margin-bottom: 20px;
				color: #333;
			}

			.login-box input {
				width: 100%;
				padding: 12px;
				border: 2px solid #ddd;
				border-radius: 6px;
				font-size: 16px;
				margin-bottom: 15px;
			}

			.login-box button {
				width: 100%;
				padding: 12px;
				background: #667eea;
				color: white;
				border: none;
				border-radius: 6px;
				font-size: 16px;
				cursor: pointer;
				transition: background 0.3s;
			}

			.login-box button:hover {
				background: #5568d3;
			}

			.error {
				color: #e74c3c;
				margin-top: 10px;
			}

			#control-panel {
				background: rgba(255, 255, 255, 0.95);
				padding: 24px;
				border-radius: 12px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
				width: 100%;
				max-width: 360px;
			}

			#control-panel h2 {
				margin-bottom: 15px;
				color: #333;
				font-size: 18px;
			}

			.control-group {
				margin-bottom: 15px;
			}

			.control-group label {
				display: block;
				margin-bottom: 5px;
				color: #555;
				font-size: 14px;
				font-weight: 500;
			}

			.control-group input[type="range"] {
				width: 100%;
			}

			.control-group input[type="number"] {
				width: 100%;
				padding: 8px;
				border: 2px solid #ddd;
				border-radius: 6px;
				font-size: 14px;
			}

			.control-group .value-display {
				display: inline-block;
				margin-left: 10px;
				color: #667eea;
				font-weight: bold;
			}

			.control-group button {
				width: 100%;
				padding: 10px;
				border: none;
				border-radius: 6px;
				font-size: 14px;
				cursor: pointer;
				transition: all 0.3s;
				font-weight: 600;
				margin-top: 5px;
			}

			.btn-primary {
				background: #667eea;
				color: white;
			}

			.btn-primary:hover {
				background: #5568d3;
			}

			.btn-success {
				background: #27ae60;
				color: white;
			}

			.btn-success:hover {
				background: #229954;
			}

			.btn-danger {
				background: #e74c3c;
				color: white;
			}

			.btn-danger:hover {
				background: #c0392b;
			}

			.btn-warning {
				background: #f39c12;
				color: white;
			}

			.btn-warning:hover {
				background: #e67e22;
			}

			.btn-active {
				background: #e74c3c;
				color: white;
			}

			#status-bar {
				background: #2c3e50;
				color: #ecf0f1;
				padding: 10px 16px;
				border-radius: 8px;
				font-size: 13px;
				margin-bottom: 15px;
			}

			#status-bar div {
				margin: 3px 0;
			}

			.control-group input[type="checkbox"] {
				width: auto;
				margin-right: 8px;
			}

			.control-group .checkbox-label {
				display: flex;
				align-items: center;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div id="login-screen">
			<div class="login-box">
				<h1>管理員密碼</h1>
				<input type="password" id="password-input" placeholder="Enter admin password" />
				<button id="login-btn">Login</button>
				<div id="login-error" class="error"></div>
			</div>
		</div>

		<div id="control-panel">
			<h2>⚙️ Control Panel</h2>

			<div id="status-bar">
				<div>
					<strong>Status:</strong>
					<span id="status">Ready</span>
				</div>
			</div>

			<div class="control-group">
				<label>
					Gravity:
					<span class="value-display" id="gravity-value">1.0</span>
				</label>
				<input type="range" id="gravity" min="0" max="5" step="0.1" value="1" />
			</div>

			<div class="control-group">
				<label>
					Elasticity:
					<span class="value-display" id="elasticity-value">0.8</span>
				</label>
				<input type="range" id="elasticity" min="0" max="1" step="0.05" value="0.8" />
			</div>

			<div class="control-group">
				<label>Countdown Timer (seconds)</label>
				<input type="number" id="countdown-seconds" min="1" max="3600" value="60" />
				<button id="start-countdown-btn" class="btn-primary">Start Countdown</button>
			</div>

			<div class="control-group">
				<button id="toggle-dropping" class="btn-success">Allow Ball Dropping</button>
			</div>

			<div class="control-group">
				<button id="reset-world-btn" class="btn-danger">Reset (Remove Floor)</button>
			</div>

			<div class="control-group">
				<label>Auto-fill after countdown ends (seconds)</label>
				<input type="number" id="autofill-seconds" min="0" max="60" value="5" />
			</div>

			<div class="control-group">
				<button id="force-autofill-btn" class="btn-primary">Force Fill Now</button>
			</div>
		</div>

		<script>
			const socket = io();

			let isDropping = false;

			// Login functionality
			const login = () => {
				const password = document.getElementById("password-input").value;
				socket.emit("admin:login", { password });
			};

			document.getElementById("login-btn").addEventListener("click", login);
			document.getElementById("password-input").addEventListener("keypress", e => {
				if (e.key === "Enter") login();
			});

			socket.on("admin:authenticated", data => {
				if (data.success) {
					document.getElementById("login-screen").classList.add("hidden");
				} else {
					document.getElementById("login-error").textContent = "Invalid password";
				}
			});

			// Physics controls
			document.getElementById("gravity").addEventListener("input", e => {
				const value = parseFloat(e.target.value);
				document.getElementById("gravity-value").textContent = value.toFixed(1);
				socket.emit("admin:updatePhysics", { gravity: value });
			});

			document.getElementById("elasticity").addEventListener("input", e => {
				const value = parseFloat(e.target.value);
				document.getElementById("elasticity-value").textContent = value.toFixed(2);
				socket.emit("admin:updatePhysics", { elasticity: value });
			});

			const toggleDropping = () => {
				isDropping = !isDropping;
				const btn = document.getElementById("toggle-dropping");

				if (isDropping) {
					btn.textContent = "Stop Ball Dropping";
					btn.classList.remove("btn-success");
					btn.classList.add("btn-active");
					document.getElementById("status").textContent = "Dropping Enabled";
				} else {
					btn.textContent = "Allow Ball Dropping";
					btn.classList.remove("btn-active");
					btn.classList.add("btn-success");
					document.getElementById("status").textContent = "Dropping Disabled";
				}

				socket.emit("admin:toggleDropping", { dropping: isDropping });
			};

			document.getElementById("toggle-dropping").addEventListener("click", toggleDropping);

			const startCountdown = () => {
				const seconds = parseInt(document.getElementById("countdown-seconds").value);
				if (seconds > 0 && seconds <= 3600) {
					socket.emit("admin:startCountdown", { seconds });
					document.getElementById("status").textContent = `Countdown: ${seconds}s`;
				}
			};

			document.getElementById("start-countdown-btn").addEventListener("click", startCountdown);

			const resetWorld = () => {
				if (confirm("This will remove the floor and all balls will fall. Continue?")) {
					socket.emit("admin:reset");
				}
			};

			document.getElementById("reset-world-btn").addEventListener("click", resetWorld);

			const forceAutoFill = () => {
				socket.emit("admin:forceAutoFill");
			};

			document.getElementById("force-autofill-btn").addEventListener("click", forceAutoFill);

			// Socket events
			socket.on("physics:update", settings => {
				if (settings.gravity !== undefined) {
					document.getElementById("gravity").value = settings.gravity;
					document.getElementById("gravity-value").textContent = settings.gravity.toFixed(1);
				}

				if (settings.elasticity !== undefined) {
					document.getElementById("elasticity").value = settings.elasticity;
					document.getElementById("elasticity-value").textContent = settings.elasticity.toFixed(2);
				}
			});

			socket.on("dropping:changed", data => {
				isDropping = data.dropping;
				const btn = document.getElementById("toggle-dropping");

				if (isDropping) {
					btn.textContent = "Stop Ball Dropping";
					btn.classList.remove("btn-success");
					btn.classList.add("btn-active");
					document.getElementById("status").textContent = "Dropping Enabled";
				} else {
					btn.textContent = "Allow Ball Dropping";
					btn.classList.remove("btn-active");
					btn.classList.add("btn-success");
					document.getElementById("status").textContent = "Dropping Disabled";
				}
			});

			socket.on("countdown:start", data => {
				let remaining = data.seconds;
				document.getElementById("status").textContent = `Countdown: ${remaining}s`;

				const interval = setInterval(() => {
					remaining--;
					if (remaining <= 0) {
						clearInterval(interval);
						document.getElementById("status").textContent = "Countdown Ended";
					} else {
						document.getElementById("status").textContent = `Countdown: ${remaining}s`;
					}
				}, 1000);
			});

			socket.on("countdown:end", () => {
				document.getElementById("status").textContent = "Countdown Ended";

				const autoFillDelay = parseInt(document.getElementById("autofill-seconds").value);
				if (autoFillDelay >= 0) {
					if (autoFillDelay === 0) {
						socket.emit("admin:forceAutoFill");
					} else {
						document.getElementById("status").textContent = `Auto-fill in ${autoFillDelay}s...`;
						setTimeout(() => {
							socket.emit("admin:forceAutoFill");
						}, autoFillDelay * 1000);
					}
				}
			});
		</script>
	</body>
</html>
