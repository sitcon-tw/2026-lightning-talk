<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>⚡ Lightning Talk - SITCON 2026</title>
		<script src="/socket.io/socket.io.js"></script>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
				background: linear-gradient(12deg, #271803 0%, #e8a53e 54.33%, #a8762d 100%);
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				color: white;
			}

			.container {
				text-align: center;
				padding: 20px;
				max-width: 500px;
				width: 100%;
			}

			.screen {
				display: none;
			}

			.screen.active {
				display: block;
				animation: fadeIn 0.5s;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			h1 {
				font-size: 3em;
				margin-bottom: 20px;
				text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
			}

			h1 span {
				color: rgb(222, 222, 222);
				font-size: 1.2rem;
				display: block;
			}

			p {
				font-size: 1.2em;
				margin-bottom: 20px;
				opacity: 0.9;
			}

			input {
				width: 100%;
				padding: 15px 20px;
				font-size: 18px;
				border: none;
				border-radius: 12px;
				margin-bottom: 15px;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
			}

			button {
				padding: 15px 40px;
				font-size: 18px;
				background: white;
				color: #915900;
				border: none;
				border-radius: 12px;
				cursor: pointer;
				font-weight: 600;
				transition: all 0.3s;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
			}

			button:hover:not(:disabled) {
				transform: translateY(-2px);
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
			}

			button:active:not(:disabled) {
				transform: translateY(0);
			}

			button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			.avatar {
				width: 120px;
				height: 120px;
				border-radius: 50%;
				margin: 20px auto;
				box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
				border: 4px solid white;
				display: block;
				color: transparent;
				background-color: #a5a5a5;
			}

			.error {
				color: #ff6b6b;
				background: rgba(255, 255, 255, 0.2);
				padding: 10px 20px;
				border-radius: 8px;
				margin: 15px 0;
			}

			.timer {
				font-size: 4em;
				font-weight: bold;
				margin: 30px 0;
				text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
			}

			.drop-button {
				width: 200px;
				height: 200px;
				border-radius: 50%;
				font-size: 24px;
				background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
				color: white;
				border: 6px solid white;
				cursor: pointer;
				transition: all 0.3s;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
				margin: 20px auto;
			}

			.drop-button:hover:not(:disabled) {
				transform: scale(1.1);
				box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
			}

			.drop-button:active:not(:disabled) {
				transform: scale(0.95);
			}

			.drop-button:disabled {
				background: #95a5a6;
				cursor: not-allowed;
				transform: scale(1);
			}

			.cooldown {
				font-size: 1.5em;
				margin-top: 15px;
				opacity: 0.8;
			}

			.status-message {
				background: rgba(255, 255, 255, 0.2);
				padding: 15px 25px;
				border-radius: 12px;
				margin: 20px 0;
				font-size: 1.1em;
			}

			#avatar-display {
				animation: floating 3s ease-in-out infinite;
			margin-block: 40px;
			@keyframes floating {
				0% {
					transform: translateY(0);
				}
				50% {
					transform: translateY(-10px);
				}
				100% {
					transform: translateY(0);
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<!-- Email Entry Screen -->
			<div id="email-screen" class="screen active">
				<h1>
					<span>SITCON 2026</span>
					⚡ Lightning Talk
				</h1>
				<p>請輸入 Email 以繼續</p>
				<input type="email" id="email-input" placeholder="your@email.com" />
				<button onclick="submitEmail()">繼續</button>
				<div id="email-error" class="error" style="display: none"></div>
			</div>

			<!-- Confirmation Screen -->
			<div id="confirm-screen" class="screen">
				<h1>確認你的頭像</h1>
				<img id="avatar-preview" class="avatar" alt="Your avatar" />
				<p id="email-display"></p>
				<button onclick="confirmAvatar()">看起來很讚！</button>
				<button onclick="backToEmail()" style="margin-left: 10px; background: transparent; color: white; border: 2px solid white">更改 Email</button>
			</div>

			<!-- Waiting Screen -->
			<div id="waiting-screen" class="screen">
				<h1>⏳ 準備好囉！</h1>
				<img id="avatar-display" class="avatar" alt="Your avatar" />
				<div class="status-message" id="waiting-message">等待開始...</div>
				<div id="countdown-display" class="timer" style="display: none"></div>
			</div>

			<!-- Active Screen -->
			<div id="active-screen" class="screen">
				<h1>Drop Your Ball!</h1>
				<img id="avatar-active" class="avatar" alt="Your avatar" />

				<button id="drop-button" class="drop-button" onclick="dropBall()">DROP!</button>

				<div id="cooldown-display" class="cooldown" style="display: none"></div>
				<div id="timer-display" class="timer" style="display: none"></div>
			</div>
		</div>

		<script>
			const socket = io();

			let userEmail = "";
			let gravatarUrl = "";
			let canDrop = false;
			let cooldownEnd = 0;
			let countdownInterval = null;

			// Email submission
			function submitEmail() {
				const email = document.getElementById("email-input").value.trim();

				if (!email || !email.includes("@")) {
					showError("email-error", "Please enter a valid email address");
					return;
				}

				userEmail = email;

				// Generate Gravatar URL (same logic as server)
				const hash = md5(email.toLowerCase().trim());
				gravatarUrl = `https://www.gravatar.com/avatar/${hash}?s=120&d=identicon`;

				// Show confirmation screen
				document.getElementById("avatar-preview").src = gravatarUrl;
				document.getElementById("email-display").textContent = email;
				showScreen("confirm-screen");
			}

			function backToEmail() {
				showScreen("email-screen");
			}

			function confirmAvatar() {
				// Join as user
				socket.emit("user:join", { email: userEmail });
			}

			document.getElementById("email-input").addEventListener("keypress", e => {
				if (e.key === "Enter") submitEmail();
			});

			// Socket events
			socket.on("user:joined", data => {
				gravatarUrl = data.gravatarUrl;
				document.getElementById("avatar-display").src = gravatarUrl;
				document.getElementById("avatar-active").src = gravatarUrl;

				if (data.dropping) {
					showScreen("active-screen");
					canDrop = true;
				} else {
					showScreen("waiting-screen");
					canDrop = false;
				}

				if (data.countdownActive) {
					// Countdown is already active
				}
			});

			socket.on("user:error", data => {
				alert(data.error);
			});

			socket.on("dropping:changed", data => {
				canDrop = data.dropping;

				if (data.dropping) {
					showScreen("active-screen");
				} else {
					showScreen("waiting-screen");
					document.getElementById("waiting-message").textContent = "Dropping has ended. Thanks for playing!";
				}
			});

			socket.on("countdown:start", data => {
				startCountdownDisplay(data.seconds);
			});

			socket.on("countdown:end", () => {
				if (countdownInterval) {
					clearInterval(countdownInterval);
					countdownInterval = null;
				}
				canDrop = false;
				showScreen("waiting-screen");
				document.getElementById("waiting-message").textContent = "Time's up! Thanks for playing!";
			});

			socket.on("user:dropped", data => {
				if (data.success) {
					cooldownEnd = data.nextDropTime;
					startCooldown();
				}
			});

			function dropBall() {
				if (!canDrop) return;

				const now = Date.now();
				if (now < cooldownEnd) {
					return;
				}

				socket.emit("user:drop", {});
			}

			function startCooldown() {
				const btn = document.getElementById("drop-button");
				const cooldownDisplay = document.getElementById("cooldown-display");

				btn.disabled = true;
				cooldownDisplay.style.display = "block";

				const interval = setInterval(() => {
					const now = Date.now();
					const remaining = Math.max(0, Math.ceil((cooldownEnd - now) / 1000));

					if (remaining <= 0) {
						clearInterval(interval);
						btn.disabled = false;
						cooldownDisplay.style.display = "none";
					} else {
						cooldownDisplay.textContent = `Wait ${remaining}s...`;
					}
				}, 100);
			}

			function startCountdownDisplay(seconds) {
				let remaining = seconds;

				const updateDisplay = () => {
					const minutes = Math.floor(remaining / 60);
					const secs = remaining % 60;
					const timeStr = `${minutes}:${secs.toString().padStart(2, "0")}`;

					// Update in both screens
					const waitingDisplay = document.getElementById("countdown-display");
					const activeDisplay = document.getElementById("timer-display");

					waitingDisplay.textContent = timeStr;
					activeDisplay.textContent = timeStr;
					waitingDisplay.style.display = "block";
					activeDisplay.style.display = "block";

					document.getElementById("waiting-message").textContent = "Game starting in...";
				};

				updateDisplay();

				if (countdownInterval) {
					clearInterval(countdownInterval);
				}

				countdownInterval = setInterval(() => {
					remaining--;

					if (remaining <= 0) {
						clearInterval(countdownInterval);
						countdownInterval = null;
					} else {
						updateDisplay();
					}
				}, 1000);
			}

			// Helper functions
			function showScreen(screenId) {
				document.querySelectorAll(".screen").forEach(screen => {
					screen.classList.remove("active");
				});
				document.getElementById(screenId).classList.add("active");
			}

			function showError(elementId, message) {
				const errorEl = document.getElementById(elementId);
				errorEl.textContent = message;
				errorEl.style.display = "block";
				setTimeout(() => {
					errorEl.style.display = "none";
				}, 3000);
			}

			// Simple MD5 implementation for Gravatar
			function md5(string) {
				function RotateLeft(lValue, iShiftBits) {
					return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits));
				}

				function AddUnsigned(lX, lY) {
					var lX4, lY4, lX8, lY8, lResult;
					lX8 = lX & 0x80000000;
					lY8 = lY & 0x80000000;
					lX4 = lX & 0x40000000;
					lY4 = lY & 0x40000000;
					lResult = (lX & 0x3fffffff) + (lY & 0x3fffffff);
					if (lX4 & lY4) {
						return lResult ^ 0x80000000 ^ lX8 ^ lY8;
					}
					if (lX4 | lY4) {
						if (lResult & 0x40000000) {
							return lResult ^ 0xc0000000 ^ lX8 ^ lY8;
						} else {
							return lResult ^ 0x40000000 ^ lX8 ^ lY8;
						}
					} else {
						return lResult ^ lX8 ^ lY8;
					}
				}

				function F(x, y, z) {
					return (x & y) | (~x & z);
				}
				function G(x, y, z) {
					return (x & z) | (y & ~z);
				}
				function H(x, y, z) {
					return x ^ y ^ z;
				}
				function I(x, y, z) {
					return y ^ (x | ~z);
				}

				function FF(a, b, c, d, x, s, ac) {
					a = AddUnsigned(a, AddUnsigned(AddUnsigned(F(b, c, d), x), ac));
					return AddUnsigned(RotateLeft(a, s), b);
				}

				function GG(a, b, c, d, x, s, ac) {
					a = AddUnsigned(a, AddUnsigned(AddUnsigned(G(b, c, d), x), ac));
					return AddUnsigned(RotateLeft(a, s), b);
				}

				function HH(a, b, c, d, x, s, ac) {
					a = AddUnsigned(a, AddUnsigned(AddUnsigned(H(b, c, d), x), ac));
					return AddUnsigned(RotateLeft(a, s), b);
				}

				function II(a, b, c, d, x, s, ac) {
					a = AddUnsigned(a, AddUnsigned(AddUnsigned(I(b, c, d), x), ac));
					return AddUnsigned(RotateLeft(a, s), b);
				}

				function ConvertToWordArray(string) {
					var lWordCount;
					var lMessageLength = string.length;
					var lNumberOfWords_temp1 = lMessageLength + 8;
					var lNumberOfWords_temp2 = (lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64)) / 64;
					var lNumberOfWords = (lNumberOfWords_temp2 + 1) * 16;
					var lWordArray = Array(lNumberOfWords - 1);
					var lBytePosition = 0;
					var lByteCount = 0;
					while (lByteCount < lMessageLength) {
						lWordCount = (lByteCount - (lByteCount % 4)) / 4;
						lBytePosition = (lByteCount % 4) * 8;
						lWordArray[lWordCount] = lWordArray[lWordCount] | (string.charCodeAt(lByteCount) << lBytePosition);
						lByteCount++;
					}
					lWordCount = (lByteCount - (lByteCount % 4)) / 4;
					lBytePosition = (lByteCount % 4) * 8;
					lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
					lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
					lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
					return lWordArray;
				}

				function WordToHex(lValue) {
					var WordToHexValue = "",
						WordToHexValue_temp = "",
						lByte,
						lCount;
					for (lCount = 0; lCount <= 3; lCount++) {
						lByte = (lValue >>> (lCount * 8)) & 255;
						WordToHexValue_temp = "0" + lByte.toString(16);
						WordToHexValue = WordToHexValue + WordToHexValue_temp.substr(WordToHexValue_temp.length - 2, 2);
					}
					return WordToHexValue;
				}

				function Utf8Encode(string) {
					string = string.replace(/\r\n/g, "\n");
					var utftext = "";
					for (var n = 0; n < string.length; n++) {
						var c = string.charCodeAt(n);
						if (c < 128) {
							utftext += String.fromCharCode(c);
						} else if (c > 127 && c < 2048) {
							utftext += String.fromCharCode((c >> 6) | 192);
							utftext += String.fromCharCode((c & 63) | 128);
						} else {
							utftext += String.fromCharCode((c >> 12) | 224);
							utftext += String.fromCharCode(((c >> 6) & 63) | 128);
							utftext += String.fromCharCode((c & 63) | 128);
						}
					}
					return utftext;
				}

				var x = Array();
				var k, AA, BB, CC, DD, a, b, c, d;
				var S11 = 7,
					S12 = 12,
					S13 = 17,
					S14 = 22;
				var S21 = 5,
					S22 = 9,
					S23 = 14,
					S24 = 20;
				var S31 = 4,
					S32 = 11,
					S33 = 16,
					S34 = 23;
				var S41 = 6,
					S42 = 10,
					S43 = 15,
					S44 = 21;

				string = Utf8Encode(string);
				x = ConvertToWordArray(string);
				a = 0x67452301;
				b = 0xefcdab89;
				c = 0x98badcfe;
				d = 0x10325476;

				for (k = 0; k < x.length; k += 16) {
					AA = a;
					BB = b;
					CC = c;
					DD = d;
					a = FF(a, b, c, d, x[k + 0], S11, 0xd76aa478);
					d = FF(d, a, b, c, x[k + 1], S12, 0xe8c7b756);
					c = FF(c, d, a, b, x[k + 2], S13, 0x242070db);
					b = FF(b, c, d, a, x[k + 3], S14, 0xc1bdceee);
					a = FF(a, b, c, d, x[k + 4], S11, 0xf57c0faf);
					d = FF(d, a, b, c, x[k + 5], S12, 0x4787c62a);
					c = FF(c, d, a, b, x[k + 6], S13, 0xa8304613);
					b = FF(b, c, d, a, x[k + 7], S14, 0xfd469501);
					a = FF(a, b, c, d, x[k + 8], S11, 0x698098d8);
					d = FF(d, a, b, c, x[k + 9], S12, 0x8b44f7af);
					c = FF(c, d, a, b, x[k + 10], S13, 0xffff5bb1);
					b = FF(b, c, d, a, x[k + 11], S14, 0x895cd7be);
					a = FF(a, b, c, d, x[k + 12], S11, 0x6b901122);
					d = FF(d, a, b, c, x[k + 13], S12, 0xfd987193);
					c = FF(c, d, a, b, x[k + 14], S13, 0xa679438e);
					b = FF(b, c, d, a, x[k + 15], S14, 0x49b40821);
					a = GG(a, b, c, d, x[k + 1], S21, 0xf61e2562);
					d = GG(d, a, b, c, x[k + 6], S22, 0xc040b340);
					c = GG(c, d, a, b, x[k + 11], S23, 0x265e5a51);
					b = GG(b, c, d, a, x[k + 0], S24, 0xe9b6c7aa);
					a = GG(a, b, c, d, x[k + 5], S21, 0xd62f105d);
					d = GG(d, a, b, c, x[k + 10], S22, 0x2441453);
					c = GG(c, d, a, b, x[k + 15], S23, 0xd8a1e681);
					b = GG(b, c, d, a, x[k + 4], S24, 0xe7d3fbc8);
					a = GG(a, b, c, d, x[k + 9], S21, 0x21e1cde6);
					d = GG(d, a, b, c, x[k + 14], S22, 0xc33707d6);
					c = GG(c, d, a, b, x[k + 3], S23, 0xf4d50d87);
					b = GG(b, c, d, a, x[k + 8], S24, 0x455a14ed);
					a = GG(a, b, c, d, x[k + 13], S21, 0xa9e3e905);
					d = GG(d, a, b, c, x[k + 2], S22, 0xfcefa3f8);
					c = GG(c, d, a, b, x[k + 7], S23, 0x676f02d9);
					b = GG(b, c, d, a, x[k + 12], S24, 0x8d2a4c8a);
					a = HH(a, b, c, d, x[k + 5], S31, 0xfffa3942);
					d = HH(d, a, b, c, x[k + 8], S32, 0x8771f681);
					c = HH(c, d, a, b, x[k + 11], S33, 0x6d9d6122);
					b = HH(b, c, d, a, x[k + 14], S34, 0xfde5380c);
					a = HH(a, b, c, d, x[k + 1], S31, 0xa4beea44);
					d = HH(d, a, b, c, x[k + 4], S32, 0x4bdecfa9);
					c = HH(c, d, a, b, x[k + 7], S33, 0xf6bb4b60);
					b = HH(b, c, d, a, x[k + 10], S34, 0xbebfbc70);
					a = HH(a, b, c, d, x[k + 13], S31, 0x289b7ec6);
					d = HH(d, a, b, c, x[k + 0], S32, 0xeaa127fa);
					c = HH(c, d, a, b, x[k + 3], S33, 0xd4ef3085);
					b = HH(b, c, d, a, x[k + 6], S34, 0x4881d05);
					a = HH(a, b, c, d, x[k + 9], S31, 0xd9d4d039);
					d = HH(d, a, b, c, x[k + 12], S32, 0xe6db99e5);
					c = HH(c, d, a, b, x[k + 15], S33, 0x1fa27cf8);
					b = HH(b, c, d, a, x[k + 2], S34, 0xc4ac5665);
					a = II(a, b, c, d, x[k + 0], S41, 0xf4292244);
					d = II(d, a, b, c, x[k + 7], S42, 0x432aff97);
					c = II(c, d, a, b, x[k + 14], S43, 0xab9423a7);
					b = II(b, c, d, a, x[k + 5], S44, 0xfc93a039);
					a = II(a, b, c, d, x[k + 12], S41, 0x655b59c3);
					d = II(d, a, b, c, x[k + 3], S42, 0x8f0ccc92);
					c = II(c, d, a, b, x[k + 10], S43, 0xffeff47d);
					b = II(b, c, d, a, x[k + 1], S44, 0x85845dd1);
					a = II(a, b, c, d, x[k + 8], S41, 0x6fa87e4f);
					d = II(d, a, b, c, x[k + 15], S42, 0xfe2ce6e0);
					c = II(c, d, a, b, x[k + 6], S43, 0xa3014314);
					b = II(b, c, d, a, x[k + 13], S44, 0x4e0811a1);
					a = II(a, b, c, d, x[k + 4], S41, 0xf7537e82);
					d = II(d, a, b, c, x[k + 11], S42, 0xbd3af235);
					c = II(c, d, a, b, x[k + 2], S43, 0x2ad7d2bb);
					b = II(b, c, d, a, x[k + 9], S44, 0xeb86d391);
					a = AddUnsigned(a, AA);
					b = AddUnsigned(b, BB);
					c = AddUnsigned(c, CC);
					d = AddUnsigned(d, DD);
				}

				var temp = WordToHex(a) + WordToHex(b) + WordToHex(c) + WordToHex(d);
				return temp.toLowerCase();
			}
		</script>
