<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lightning Talk - SITCON 2026</title>
		<script src="/socket.io/socket.io.js"></script>
		<meta name="theme-color" content="#010121" />
		<link rel="icon" type="image/png" href="/icon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/icon/favicon.svg" />
		<link rel="shortcut icon" href="/icon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="SITCON 2026 閃電講" />
		<link rel="manifest" href="/icon/site.webmanifest" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
				background: linear-gradient(12deg, #271803 0%, #e8a53e 54.33%, #a8762d 100%);
				background-color: #271803;
				min-height: 100vh;
				min-height: 100svh;
				display: flex;
				justify-content: center;
				align-items: center;
				color: white;
				overflow: hidden;
			}

			.container {
				text-align: center;
				padding: 20px;
				max-width: 500px;
				width: 100%;
			}

			.screen {
				display: none;
			}

			.screen.active {
				display: block;
				animation: fadeIn 0.5s;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			h1 {
				font-size: 3em;
				margin-bottom: 20px;
				text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
			}

			h1 span {
				color: rgb(222, 222, 222);
				font-size: 1.2rem;
				display: block;
			}

			p {
				font-size: 1.2em;
				margin-bottom: 20px;
				opacity: 0.9;
			}

			input {
				width: 100%;
				padding: 15px 20px;
				font-size: 18px;
				border: none;
				border-radius: 12px;
				margin-bottom: 15px;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
			}

			.button-container {
				display: flex;
				gap: 1rem;
				justify-content: center;
				flex-wrap: wrap;
			}

			button {
				padding: 15px 40px;
				font-size: 18px;
				background: white;
				color: #915900;
				border: none;
				border-radius: 12px;
				cursor: pointer;
				font-weight: 600;
				transition: all 0.3s;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
			}

			#back-to-email-btn {
				background: transparent;
				color: white;
				border: 2px solid white;
			}

			button:hover:not(:disabled) {
				transform: translateY(-2px);
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
			}

			button:active:not(:disabled) {
				transform: translateY(0);
			}

			button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			.avatar {
				width: 120px;
				height: 120px;
				border-radius: 50%;
				margin: 20px auto;
				box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
				border: 4px solid white;
				display: block;
				color: transparent;
				background-color: #a5a5a5;
			}

			.error {
				color: #b00707;
				background: rgba(255, 255, 255, 0.2);
				padding: 10px 20px;
				border-radius: 8px;
				margin: 15px 0;
			}

			.timer {
				font-size: 4em;
				font-weight: bold;
				margin: 30px 0;
				text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
			}

			.cooldown {
				font-size: 1.5em;
				margin-top: 15px;
				opacity: 0.8;
			}

			/* Throw screen */
			#active-screen {
				position: fixed !important;
				inset: 0;
				display: none;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;
				padding-top: 40px;
			}

			#active-screen.active {
				display: flex !important;
			}

			#throw-area {
				position: fixed;
				inset: 0;
				pointer-events: none;
				touch-action: none;
			}

			#throw-info {
				font-size: 1em;
				opacity: 0.7;
				margin-top: 8px;
			}

			.throw-ball {
				position: absolute;
				border-radius: 50%;
				border: 4px solid white;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
				pointer-events: none;
				will-change: transform;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
				transition: box-shadow 0.1s;
				cursor: grab;
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
			}

			.throw-ball img {
				width: 100%;
				height: 100%;
				border-radius: 50%;
				display: block;
				pointer-events: none;
				user-select: none;
			}

			.throw-ball.cooldown-ball {
				filter: grayscale(0.7) brightness(0.7);
			}

			#cooldown-overlay {
				position: fixed;
				bottom: 30px;
				left: 50%;
				transform: translateX(-50%);
				background: rgba(0, 0, 0, 0.6);
				color: white;
				padding: 10px 24px;
				border-radius: 20px;
				font-size: 1.1em;
				font-weight: 600;
				pointer-events: none;
				opacity: 0;
				transition: opacity 0.2s;
			}

			#cooldown-overlay.visible {
				opacity: 1;
			}

			#timer-display {
				position: fixed !important;
				top: 20px;
				right: 20px;
				font-size: 2.5em !important;
				margin: 0 !important;
			}

			.status-message {
				background: rgba(255, 255, 255, 0.2);
				padding: 15px 25px;
				border-radius: 12px;
				margin: 20px 0;
				font-size: 1.1em;
			}

			#avatar-display {
				animation: floating 3s ease-in-out infinite;
				margin-block: 40px;
			}

			@keyframes floating {
				0% {
					transform: translateY(0);
				}
				50% {
					transform: translateY(-10px);
				}
				100% {
					transform: translateY(0);
				}
			}
		</style>

	<body>
		<div class="container">
			<!-- Email Entry Screen -->
			<div id="email-screen" class="screen active">
				<h1>
					<span>⚡ SITCON 2026</span>
					Lightning Talk
				</h1>
				<p>請輸入 Email 以繼續</p>
				<input type="email" id="email-input" placeholder="your@email.com" />
				<button id="submit-email-btn">繼續</button>
				<div id="email-error" class="error" style="display: none"></div>
			</div>

			<!-- Confirmation Screen -->
			<div id="confirm-screen" class="screen">
				<h1>確認你的頭像</h1>
				<img id="avatar-preview" class="avatar" alt="Your avatar" />
				<p id="email-display"></p>
				<div class="button-container">
					<button id="back-to-email-btn">更改 Email</button>
					<button id="confirm-avatar-btn">看起來很讚！</button>
				</div>
			</div>

			<!-- Waiting Screen -->
			<div id="waiting-screen" class="screen">
				<h1>⏳ 準備好囉！</h1>
				<img id="avatar-display" class="avatar" alt="Your avatar" />
				<div class="status-message" id="waiting-message">等待開始...</div>
				<div id="countdown-display" class="timer" style="display: none"></div>
			</div>

			<!-- Active Screen -->
			<div id="active-screen" class="screen">
				<p id="throw-info" style="margin-top: 40px; opacity: 0.8">往上滑丟出球！</p>
				<div id="throw-area"></div>
				<div id="cooldown-overlay"></div>
				<div id="timer-display" class="timer" style="display: none"></div>
			</div>
		</div>

		<script>
			const socket = io();

			let userEmail = "";
			let gravatarUrl = "";
			let canDrop = false;
			let cooldownEnd = 0;
			let countdownInterval = null;

			const clearCountdownDisplay = () => {
				if (countdownInterval) {
					clearInterval(countdownInterval);
					countdownInterval = null;
				}
				document.getElementById("countdown-display").style.display = "none";
				document.getElementById("timer-display").style.display = "none";
			};

			// Email submission
			const submitEmail = () => {
				const email = document.getElementById("email-input").value.trim();

				if (!email || !email.includes("@")) {
					showError("email-error", "Please enter a valid email address");
					return;
				}

				userEmail = email;

				// Generate Gravatar URL (same logic as server)
				const hash = md5(email.toLowerCase().trim());
				gravatarUrl = `https://www.gravatar.com/avatar/${hash}?s=120&d=identicon`;

				// Show confirmation screen
				document.getElementById("avatar-preview").src = gravatarUrl;
				document.getElementById("email-display").textContent = email;
				showScreen("confirm-screen");
			};

			const backToEmail = () => {
				showScreen("email-screen");
			};

			const confirmAvatar = () => {
				// Join as user
				socket.emit("user:join", { email: userEmail });
			};

			document.getElementById("submit-email-btn").addEventListener("click", submitEmail);
			document.getElementById("confirm-avatar-btn").addEventListener("click", confirmAvatar);
			document.getElementById("back-to-email-btn").addEventListener("click", backToEmail);
			document.getElementById("email-input").addEventListener("keypress", e => {
				if (e.key === "Enter") submitEmail();
			});

			// Socket events
			socket.on("user:joined", data => {
				gravatarUrl = data.gravatarUrl;
				document.getElementById("avatar-display").src = gravatarUrl;

				if (data.dropping) {
					showScreen("active-screen");
					canDrop = true;
					spawnThrowBall();
				} else {
					showScreen("waiting-screen");
					canDrop = false;
				}

				if (data.countdownActive) {
					// Countdown is already active
				}
			});

			socket.on("user:error", data => {
				// silently ignore server-side errors (e.g. rate limit, too-soon drop)
			});

			socket.on("dropping:changed", data => {
				canDrop = data.dropping;

				if (data.dropping) {
					clearCountdownDisplay();
					showScreen("active-screen");
					if (!throwBallEl) spawnThrowBall();
				} else {
					showScreen("waiting-screen");
					if (throwBallEl) {
						throwBallEl.remove();
						throwBallEl = null;
					}
					document.getElementById("waiting-message").textContent = "丟球結束！";
				}
			});

			socket.on("countdown:start", data => {
				startCountdownDisplay(data.seconds);
			});

			socket.on("countdown:end", () => {
				clearCountdownDisplay();
				document.getElementById("waiting-message").textContent = "已開放投球！";
			});

			socket.on("countdown:cancel", () => {
				clearCountdownDisplay();
			});

			socket.on("user:dropped", data => {
				if (data.success) {
					cooldownEnd = data.nextDropTime;
					startCooldown();
				}
			});

			// ── Throw mechanic ─────────────────────────────────────────
			const BALL_SIZE = 100; // px diameter at rest
			const BALL_BOTTOM_OFFSET = 60; // px from bottom edge

			let throwBallEl = null;
			let isDragging = false;
			let lastPointerX = 0,
				lastPointerY = 0;
			let ballCurX = 0,
				ballCurY = 0;
			let ballStartX = 0,
				ballStartY = 0;
			let lastVX = 0,
				lastVY = 0;
			let lastMoveTime = 0;
			let throwAnimId = null;

			// Spawn the throw ball at bottom-center
			const spawnThrowBall = () => {
				const area = document.getElementById("throw-area");
				area.innerHTML = "";

				const ball = document.createElement("div");
				ball.className = "throw-ball";
				const size = BALL_SIZE;
				ball.style.width = size + "px";
				ball.style.height = size + "px";

				const img = document.createElement("img");
				img.src = gravatarUrl;
				img.draggable = false;
				ball.appendChild(img);

				const cx = window.innerWidth / 2;
				const cy = window.innerHeight - BALL_BOTTOM_OFFSET - size / 2;
				ball.style.left = cx - size / 2 + "px";
				ball.style.top = cy - size / 2 + "px";

				area.appendChild(ball);
				throwBallEl = ball;

				// Pointer events on the ball
				ball.style.pointerEvents = "auto";
				ball.addEventListener("pointerdown", onPointerDown);
			};

			const setBallPos = (x, y) => {
				const size = parseInt(throwBallEl.style.width);
				throwBallEl.style.left = x - size / 2 + "px";
				throwBallEl.style.top = y - size / 2 + "px";
			};

			const onPointerDown = e => {
				if (!canDrop || Date.now() < cooldownEnd) return;
				e.preventDefault();

				isDragging = true;
				const rect = throwBallEl.getBoundingClientRect();
				ballCurX = rect.left + rect.width / 2;
				ballCurY = rect.top + rect.height / 2;
				ballStartX = ballCurX;
				ballStartY = ballCurY;
				lastPointerX = e.clientX;
				lastPointerY = e.clientY;
				lastVX = 0;
				lastVY = 0;
				lastMoveTime = Date.now();

				throwBallEl.setPointerCapture(e.pointerId);
				throwBallEl.addEventListener("pointermove", onPointerMove);
				throwBallEl.addEventListener("pointerup", onPointerUp);
				throwBallEl.addEventListener("pointercancel", onPointerUp);
			};

			const onPointerMove = e => {
				if (!isDragging) return;
				e.preventDefault();

				const now = Date.now();
				const dt = now - lastMoveTime;

				const dx = e.clientX - lastPointerX;
				const dy = e.clientY - lastPointerY;
				ballCurX += dx;
				ballCurY += dy;

				if (dt > 0) {
					lastVX = (dx / dt) * 16;
					lastVY = (dy / dt) * 16;
				}

				lastPointerX = e.clientX;
				lastPointerY = e.clientY;
				lastMoveTime = now;

				// Scale ball slightly smaller while dragging (gives "squish" feel)
				const dragDist = Math.hypot(ballCurX - ballStartX, ballCurY - ballStartY);
				const scale = Math.max(0.85, 1 - dragDist / 1200);
				throwBallEl.style.transform = `scale(${scale})`;

				setBallPos(ballCurX, ballCurY);
			};

			const onPointerUp = e => {
				if (!isDragging) return;
				isDragging = false;

				throwBallEl.removeEventListener("pointermove", onPointerMove);
				throwBallEl.removeEventListener("pointerup", onPointerUp);
				throwBallEl.removeEventListener("pointercancel", onPointerUp);
				throwBallEl.style.transform = "";

				// On pointercancel (e.g. browser scroll takeover), always snap back
				if (e.type === "pointercancel") {
					snapBack(throwBallEl);
					const ball = throwBallEl;
					ball.classList.add("cooldown-ball");
					ball.style.pointerEvents = "none";
					setTimeout(() => {
						if (ball && ball.parentNode) {
							ball.classList.remove("cooldown-ball");
							ball.style.pointerEvents = "auto";
							ball.removeEventListener("pointerdown", onPointerDown);
							ball.addEventListener("pointerdown", onPointerDown);
						}
					}, 500);
					return;
				}

				const speed = Math.hypot(lastVX, lastVY);
				const isThrowUp = lastVY < -1.5 && speed > 2;
				const totalDrag = Math.hypot(ballCurX - ballStartX, ballCurY - ballStartY);
				const isTap = totalDrag < 10;

				if ((isTap || isThrowUp) && canDrop && Date.now() >= cooldownEnd) {
					// Tap: launch straight up with a fixed velocity
					const vx = isTap ? 0 : lastVX;
					const vy = isTap ? -10 : lastVY;
					launchBall(vx, vy);
				} else {
					// Not thrown hard enough — snap back and briefly lock the ball
					snapBack(throwBallEl);
					const ball = throwBallEl;
					ball.classList.add("cooldown-ball");
					ball.style.pointerEvents = "none";
					setTimeout(() => {
						if (ball && ball.parentNode) {
							ball.classList.remove("cooldown-ball");
							ball.style.pointerEvents = "auto";
							ball.removeEventListener("pointerdown", onPointerDown);
							ball.addEventListener("pointerdown", onPointerDown);
						}
					}, 800);
				}
			};

			const launchBall = (vx, vy) => {
				// Vibrate on throw
				if (navigator.vibrate) navigator.vibrate(80);

				// Emit to server
				socket.emit("user:drop", {});

				// Animate ball flying up and off screen
				let x = ballCurX;
				let y = ballCurY;
				const gravity = 0.11;

				// clamp horizontal, slow down vertical for ~0.8s flight
				const launchVX = Math.max(-9, Math.min(9, vx * 0.55));
				const launchVY = Math.max(-20, Math.min(-7, vy * 0.85));

				let animVX = launchVX;
				let animVY = launchVY;

				const flyingBall = throwBallEl;
				throwBallEl = null;
				flyingBall.style.pointerEvents = "none";

				const animate = () => {
					animVY += gravity;
					x += animVX;
					y += animVY;

					const size = parseInt(flyingBall.style.width);
					flyingBall.style.left = x - size / 2 + "px";
					flyingBall.style.top = y - size / 2 + "px";

					// Scale up slightly as it launches (satisfying pop)
					const progress = Math.max(0, -y / window.innerHeight);
					const scale = 1 + progress * 0.3;
					flyingBall.style.transform = `scale(${scale})`;

					if (y < -150 || x < -150 || x > window.innerWidth + 150 || y > window.innerHeight + 150) {
						flyingBall.remove();
						return;
					}
					throwAnimId = requestAnimationFrame(animate);
				};
				throwAnimId = requestAnimationFrame(animate);

				// Spawn next ball immediately; cooldown controls when it can be thrown
				rollUpBall();
			};

			const snapBack = ball => {
				ball = ball || throwBallEl;
				if (!ball) return;
				const size = parseInt(ball.style.width);
				const targetX = window.innerWidth / 2;
				const targetY = window.innerHeight - BALL_BOTTOM_OFFSET - size / 2;

				let x = parseFloat(ball.style.left) + size / 2;
				let y = parseFloat(ball.style.top) + size / 2;

				const animate = () => {
					if (!ball.parentNode) return;
					x += (targetX - x) * 0.2;
					y += (targetY - y) * 0.2;
					ball.style.left = x - size / 2 + "px";
					ball.style.top = y - size / 2 + "px";

					if (Math.abs(x - targetX) < 0.5 && Math.abs(y - targetY) < 0.5) {
						ball.style.left = targetX - size / 2 + "px";
						ball.style.top = targetY - size / 2 + "px";
						return;
					}
					requestAnimationFrame(animate);
				};
				requestAnimationFrame(animate);
			};

			// Roll a new ball up from below the screen into resting position
			const rollUpBall = () => {
				const area = document.getElementById("throw-area");
				const size = BALL_SIZE;
				const cx = window.innerWidth / 2;
				const restY = window.innerHeight - BALL_BOTTOM_OFFSET - size / 2;
				const startY = window.innerHeight + size;

				const ball = document.createElement("div");
				ball.className = "throw-ball cooldown-ball";
				ball.style.width = size + "px";
				ball.style.height = size + "px";
				ball.style.pointerEvents = "none";

				const img = document.createElement("img");
				img.src = gravatarUrl;
				img.draggable = false;
				ball.appendChild(img);

				ball.style.left = cx - size / 2 + "px";
				ball.style.top = startY - size / 2 + "px";
				area.appendChild(ball);
				throwBallEl = ball;

				// Spring animation up to resting position
				let y = startY;
				const rollUp = () => {
					y += (restY - y) * 0.18;
					ball.style.top = y - size / 2 + "px";
					if (Math.abs(y - restY) > 0.5) {
						requestAnimationFrame(rollUp);
					} else {
						ball.style.top = restY - size / 2 + "px";
						// If cooldown is already over by the time the ball arrives, enable it now
						if (Date.now() >= cooldownEnd) {
							ball.classList.remove("cooldown-ball");
							ball.style.pointerEvents = "auto";
							ball.addEventListener("pointerdown", onPointerDown);
						}
						// Otherwise startCooldown's interval will enable it when the time comes
					}
				};
				requestAnimationFrame(rollUp);
			};

			const startCooldown = () => {
				const overlay = document.getElementById("cooldown-overlay");
				overlay.classList.add("visible");

				const interval = setInterval(() => {
					const now = Date.now();
					const remaining = Math.max(0, Math.ceil((cooldownEnd - now) / 1000));

					if (remaining <= 0) {
						clearInterval(interval);
						overlay.classList.remove("visible");
						// Enable the ball that rolled up (remove first to avoid duplicate listeners)
						if (throwBallEl) {
							throwBallEl.classList.remove("cooldown-ball");
							throwBallEl.style.pointerEvents = "auto";
							throwBallEl.removeEventListener("pointerdown", onPointerDown);
							throwBallEl.addEventListener("pointerdown", onPointerDown);
						}
					} else {
						overlay.textContent = `再等 ${remaining}s`;
					}
				}, 100);
			};
			// ────────────────────────────────────────────────────────────

			const startCountdownDisplay = seconds => {
				let remaining = seconds;
				clearCountdownDisplay();

				const updateDisplay = () => {
					const minutes = Math.floor(remaining / 60);
					const secs = remaining % 60;
					const timeStr = `${minutes}:${secs.toString().padStart(2, "0")}`;

					// Update in both screens
