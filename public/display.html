<!doctype html>
<html lang="zh-Hant-TW">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>💻 Lightning Talk Display - SITCON 2026</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
		<script src="/socket.io/socket.io.js"></script>
		<meta name="theme-color" content="#010121" />
		<link rel="icon" type="image/png" href="/icon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/icon/favicon.svg" />
		<link rel="shortcut icon" href="/icon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="SITCON 2026 閃電講" />
		<link rel="manifest" href="/icon/site.webmanifest" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
				overflow: hidden;
				background: transparent;
				transition: background 0.3s;
			}

			body.greenscreen {
				background: #00ff00;
			}

			#canvas-container {
				width: 100vw;
				height: 100vh;
				position: relative;
			}

			#stats {
				position: fixed;
				top: 20px;
				left: 20px;
				background: rgba(255, 255, 255, 0.95);
				padding: 15px 20px;
				border-radius: 12px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
				font-size: 14px;
				color: #333;
				z-index: 1000;
			}

			#stats div {
				margin: 5px 0;
			}

			#ui-hint {
				position: fixed;
				bottom: 20px;
				right: 20px;
				background: rgba(0, 0, 0, 0.5);
				color: white;
				padding: 8px 14px;
				border-radius: 8px;
				font-size: 12px;
				z-index: 1000;
			}

			.hidden-ui #stats,
			.hidden-ui #ui-hint,
			.hidden-ui #bg-toggle-btn {
				display: none !important;
			}

			#bg-toggle-btn {
				position: fixed;
				bottom: 20px;
				left: 20px;
				background: rgba(255, 255, 255, 0.9);
				border: none;
				padding: 8px 14px;
				border-radius: 8px;
				font-size: 12px;
				cursor: pointer;
				z-index: 1000;
			}
		</style>

	<body>
		<div id="canvas-container"></div>

		<div id="stats">
			<div>
				<strong>球球數量：</strong>
				<span id="ball-count">0</span>
				/
				<span id="target-count">0</span>
			</div>
			<div>
				<strong>狀態：</strong>
				<span id="status">Ready</span>
			</div>
		</div>

		<button id="bg-toggle-btn">切換透明／綠幕背景</button>

		<div id="ui-hint">按 H 隱藏 UI（或是網址添加 ?hide=true）</div>

		<script>
			const socket = io();

			let engine, render, runner;
			let ground, leftWall, rightWall;
			let balls = [];
			let ballSize = 40;
			let physicsSettings = { gravity: 1, elasticity: 0.8 };

			const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;

			// Initialize Matter.js immediately (no login needed)
			const initPhysics = () => {
				const width = window.innerWidth;
				const height = window.innerHeight;

				engine = Engine.create();
				engine.gravity.y = 1;

				render = Render.create({
					element: document.getElementById("canvas-container"),
					engine: engine,
					options: {
						width: width,
						height: height,
						wireframes: false,
						background: "transparent"
					}
				});

				ground = Bodies.rectangle(width / 2, height + 10, width, 20, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				leftWall = Bodies.rectangle(-10, height / 2, 20, height, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				rightWall = Bodies.rectangle(width + 10, height / 2, 20, height, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				Composite.add(engine.world, [ground, leftWall, rightWall]);

				// Cache for avatar images
				const imageCache = new Map();
				const getImage = url => {
					if (imageCache.has(url)) return imageCache.get(url);
					const img = new Image();
					img.crossOrigin = "anonymous";
					img.src = url;
					imageCache.set(url, img);
					return img;
				};

				// Draw circular avatars on top of each ball after every render frame
				Events.on(render, "afterRender", () => {
					const ctx = render.context;
					for (const ball of balls) {
						if (!ball._gravatarUrl) continue;
						const img = getImage(ball._gravatarUrl);
						if (!img.complete || img.naturalWidth === 0) continue;

						const { x, y } = ball.position;
						const r = ball.circleRadius || ballSize;
						const angle = ball.angle;

						ctx.save();
						ctx.translate(x, y);
						ctx.rotate(angle);
						ctx.beginPath();
						ctx.arc(0, 0, r, 0, Math.PI * 2);
						ctx.closePath();
						ctx.clip();
						ctx.drawImage(img, -r, -r, r * 2, r * 2);
						ctx.restore();
					}
				});

				Render.run(render);
				runner = Runner.create();
				Runner.run(runner, engine);

				updateBallCount();
				updateTargetCount();
			};

			const updateBallCount = () => {
				document.getElementById("ball-count").textContent = balls.length;
				updateTargetCount();
			};

			const updateTargetCount = () => {
				const { count } = calculateBallParams();
				document.getElementById("target-count").textContent = count;
			};

			const calculateBallParams = () => {
				// Hexagonal packing efficiency ~0.9065, use 0.85 for comfort margin
				const r = ballSize;
				const maxBalls = Math.floor(((window.innerWidth * window.innerHeight) / (Math.PI * r * r)) * 0.85);
				return { radius: r, count: maxBalls };
			};

			// Socket events
			socket.on("connect", () => {
				socket.emit("display:join");
			});

			socket.on("ball:add", data => {
				// Enforce ball cap — ignore if screen is full
				const { count: maxBalls } = calculateBallParams();
				if (balls.length >= maxBalls) return;

				const x = Math.random() * (window.innerWidth - 200) + 100;
				const y = -50;
				const radius = ballSize;
				const elasticity = engine ? engine.gravity.y * 0.4 + 0.4 : 0.8;

				const ball = Bodies.circle(x, y, radius, {
					restitution: elasticity,
					friction: 0.001,
					density: 0.001,
					render: {
						fillStyle: "transparent",
						strokeStyle: "transparent",
						lineWidth: 0
					}
				});
				ball._gravatarUrl = data.gravatarUrl;

				Composite.add(engine.world, ball);
				balls.push(ball);
				updateBallCount();
			});

			socket.on("physics:update", settings => {
				if (!engine) return;

				if (settings.gravity !== undefined) {
					engine.gravity.y = settings.gravity;
					physicsSettings.gravity = settings.gravity;
				}

				if (settings.elasticity !== undefined) {
					physicsSettings.elasticity = settings.elasticity;
					balls.forEach(ball => {
						ball.restitution = settings.elasticity;
					});
				}

				if (settings.ballSize !== undefined) {
					ballSize = settings.ballSize;
					updateTargetCount();
				}
			});

			socket.on("dropping:changed", data => {
				document.getElementById("status").textContent = data.dropping ? "丟球中" : "目前禁止丟球";
			});

			socket.on("countdown:start", data => {
				let remaining = data.seconds;
				document.getElementById("status").textContent = `倒數：${remaining} 秒`;

				const interval = setInterval(() => {
					remaining--;
					if (remaining <= 0) {
						clearInterval(interval);
						document.getElementById("status").textContent = "倒數結束！";
					} else {
						document.getElementById("status").textContent = `倒數：${remaining} 秒`;
					}
				}, 1000);
			});

			socket.on("world:reset", () => {
				if (!engine) return;

				Composite.remove(engine.world, ground);

				setTimeout(() => {
					balls.forEach(ball => {
						Composite.remove(engine.world, ball);
					});
					balls = [];
					updateBallCount();

					ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 10, window.innerWidth, 20, {
						isStatic: true,
						render: { fillStyle: "transparent" }
					});
					Composite.add(engine.world, ground);
				}, 3000);
			});

			socket.on("autofill:start", data => {
				const gravatarUrls = Array.isArray(data?.gravatarUrls) ? data.gravatarUrls.filter(Boolean) : [];
				const { radius, count: targetCount } = calculateBallParams();
				const ballsToAdd = Math.max(0, targetCount - balls.length);

				if (ballsToAdd === 0) {
					document.getElementById("status").textContent = "畫面已經滿了！";
					return;
				}

				if (gravatarUrls.length === 0) {
					document.getElementById("status").textContent = "這回合還沒有人投球，無法自動填滿。";
					return;
				}

				document.getElementById("status").textContent = `用本回合頭像自動填滿 ${ballsToAdd} 顆球...`;

				const interval = 2000 / ballsToAdd;
				let added = 0;
				const elasticity = engine ? (physicsSettings ? physicsSettings.elasticity : 0.8) : 0.8;

				const fillInterval = setInterval(() => {
					if (added >= ballsToAdd) {
						clearInterval(fillInterval);
						document.getElementById("status").textContent = "自動填充完成！";
						return;
					}

					const x = Math.random() * (window.innerWidth - radius * 4) + radius * 2;
					const gravatarUrl = gravatarUrls[Math.floor(Math.random() * gravatarUrls.length)];

					const ball = Bodies.circle(x, -50, radius, {
						restitution: elasticity,
						friction: 0.001,
						density: 0.001,
						render: {
							fillStyle: "transparent",
							strokeStyle: "transparent",
							lineWidth: 0
						}
					});
					ball._gravatarUrl = gravatarUrl;

					Composite.add(engine.world, ball);
					balls.push(ball);
					updateBallCount();
					added++;
				}, interval);
			});

			// Toggle background (chroma key green / transparent)
			let isGreenscreen = false;
			const updateBgToggleBtn = () => {
				document.getElementById("bg-toggle-btn").textContent = isGreenscreen ? "切換透明背景" : "切換綠幕背景";
			};
			const toggleBackground = () => {
				isGreenscreen = !isGreenscreen;
				document.body.classList.toggle("greenscreen", isGreenscreen);
				updateBgToggleBtn();
			};

			document.getElementById("bg-toggle-btn").addEventListener("click", toggleBackground);

			// Toggle UI visibility
			const toggleUI = () => {
				document.body.classList.toggle("hidden-ui");
			};

			document.addEventListener("keydown", e => {
				if (e.key === "h" || e.key === "H") toggleUI();
			});

			// URL params: ?hide=true  → auto-hide UI on load
			//             ?mode=1     → transparent (default)
			//             ?mode=2     → green screen
			const params = new URLSearchParams(location.search);
			if (params.get("hide") === "true") document.body.classList.add("hidden-ui");
			if (params.get("mode") === "2") {
				isGreenscreen = true;
				document.body.classList.add("greenscreen");
			}
			updateBgToggleBtn();

			// Window resize
			window.addEventListener("resize", () => {
				if (!render || !engine) return;

				const width = window.innerWidth;
				const height = window.innerHeight;

				render.canvas.width = width;
				render.canvas.height = height;
				render.options.width = width;
				render.options.height = height;

				Composite.remove(engine.world, ground);
				Composite.remove(engine.world, leftWall);
				Composite.remove(engine.world, rightWall);

				ground = Bodies.rectangle(width / 2, height + 10, width, 20, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				leftWall = Bodies.rectangle(-10, height / 2, 20, height, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				rightWall = Bodies.rectangle(width + 10, height / 2, 20, height, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				Composite.add(engine.world, [ground, leftWall, rightWall]);
				updateTargetCount();
			});

			initPhysics();
		</script>
