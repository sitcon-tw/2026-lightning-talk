<!doctype html>
<html lang="zh-Hant-TW">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ball Display</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
		<script src="/socket.io/socket.io.js"></script>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
				overflow: hidden;
				background: #00ff00;
				transition: background 0.3s;
			}

			body.transparent {
				background: transparent;
			}

			#canvas-container {
				width: 100vw;
				height: 100vh;
				position: relative;
			}

			#stats {
				position: fixed;
				top: 20px;
				left: 20px;
				background: rgba(255, 255, 255, 0.95);
				padding: 15px 20px;
				border-radius: 12px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
				font-size: 14px;
				color: #333;
				z-index: 1000;
			}

			#stats div {
				margin: 5px 0;
			}

			#ui-hint {
				position: fixed;
				bottom: 20px;
				right: 20px;
				background: rgba(0, 0, 0, 0.5);
				color: white;
				padding: 8px 14px;
				border-radius: 8px;
				font-size: 12px;
				z-index: 1000;
			}

			.hidden-ui #stats,
			.hidden-ui #ui-hint {
				display: none !important;
			}

			#bg-toggle-btn {
				position: fixed;
				bottom: 20px;
				left: 20px;
				background: rgba(255, 255, 255, 0.9);
				border: none;
				padding: 8px 14px;
				border-radius: 8px;
				font-size: 12px;
				cursor: pointer;
				z-index: 1000;
			}

			.hidden-ui #bg-toggle-btn {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<div id="canvas-container"></div>

		<div id="stats">
			<div>
				<strong>Ball Count:</strong>
				<span id="ball-count">0</span>
				/
				<span id="target-count">0</span>
			</div>
			<div>
				<strong>Status:</strong>
				<span id="status">Ready</span>
			</div>
		</div>

		<button id="bg-toggle-btn">Toggle Background</button>

		<div id="ui-hint">Press H to toggle UI</div>

		<script>
			const socket = io();

			let engine, render, runner;
			let ground, leftWall, rightWall;
			let balls = [];
			let ballSize = 40;
			let physicsSettings = { gravity: 1, elasticity: 0.8 };

			const { Engine, Render, Runner, Bodies, Composite } = Matter;

			// Initialize Matter.js immediately (no login needed)
			const initPhysics = () => {
				const width = window.innerWidth;
				const height = window.innerHeight;

				engine = Engine.create();
				engine.gravity.y = 1;

				render = Render.create({
					element: document.getElementById("canvas-container"),
					engine: engine,
					options: {
						width: width,
						height: height,
						wireframes: false,
						background: "transparent"
					}
				});

				ground = Bodies.rectangle(width / 2, height + 10, width, 20, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				leftWall = Bodies.rectangle(-10, height / 2, 20, height, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				rightWall = Bodies.rectangle(width + 10, height / 2, 20, height, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				Composite.add(engine.world, [ground, leftWall, rightWall]);

				Render.run(render);
				runner = Runner.create();
				Runner.run(runner, engine);

				updateBallCount();
				updateTargetCount();
			};

			const updateBallCount = () => {
				document.getElementById("ball-count").textContent = balls.length;
				updateTargetCount();
			};

			const updateTargetCount = () => {
				const { count } = calculateBallParams();
				document.getElementById("target-count").textContent = count;
			};

			const calculateBallParams = () => {
				const totalBalls = Math.floor((window.innerWidth * window.innerHeight) / ballSize / ballSize);
				return { radius: ballSize, count: totalBalls };
			};

			// Socket events
			socket.on("connect", () => {
				socket.emit("display:join");
			});

			socket.on("ball:add", data => {
				const x = Math.random() * (window.innerWidth - 200) + 100;
				const y = -50;
				const radius = ballSize;
				const elasticity = engine ? engine.gravity.y * 0.4 + 0.4 : 0.8;

				const ball = Bodies.circle(x, y, radius, {
					restitution: elasticity,
					friction: 0.001,
					density: 0.001,
					render: {
						fillStyle: data.color,
						strokeStyle: "#fff",
						lineWidth: 3
					}
				});

				Composite.add(engine.world, ball);
				balls.push(ball);
				updateBallCount();
			});

			socket.on("physics:update", settings => {
				if (!engine) return;

				if (settings.gravity !== undefined) {
					engine.gravity.y = settings.gravity;
					physicsSettings.gravity = settings.gravity;
				}

				if (settings.elasticity !== undefined) {
					physicsSettings.elasticity = settings.elasticity;
					balls.forEach(ball => {
						ball.restitution = settings.elasticity;
					});
				}

				if (settings.ballSize !== undefined) {
					ballSize = settings.ballSize;
					updateTargetCount();
				}
			});

			socket.on("dropping:changed", data => {
				document.getElementById("status").textContent = data.dropping ? "Dropping Enabled" : "Dropping Disabled";
			});

			socket.on("countdown:start", data => {
				let remaining = data.seconds;
				document.getElementById("status").textContent = `Countdown: ${remaining}s`;

				const interval = setInterval(() => {
					remaining--;
					if (remaining <= 0) {
						clearInterval(interval);
						document.getElementById("status").textContent = "Countdown Ended";
					} else {
						document.getElementById("status").textContent = `Countdown: ${remaining}s`;
					}
				}, 1000);
			});

			socket.on("world:reset", () => {
				if (!engine) return;

				Composite.remove(engine.world, ground);

				setTimeout(() => {
					balls.forEach(ball => {
						Composite.remove(engine.world, ball);
					});
					balls = [];
					updateBallCount();

					ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 10, window.innerWidth, 20, {
						isStatic: true,
						render: { fillStyle: "transparent" }
					});
					Composite.add(engine.world, ground);
				}, 3000);
			});

			socket.on("autofill:start", data => {
				const autofillColors = ["#FF6B6B", "#4ECDC4", "#45B7D1", "#F7DC6F", "#BB8FCE", "#58D68D", "#F8B739", "#EC7063"];
				const { radius, count: targetCount } = calculateBallParams();
				const ballsToAdd = Math.max(0, targetCount - balls.length);

				if (ballsToAdd === 0) {
					document.getElementById("status").textContent = "Already filled!";
					return;
				}

				document.getElementById("status").textContent = `Auto-filling ${ballsToAdd} balls...`;

				const interval = 2000 / ballsToAdd;
				let added = 0;
				const elasticity = engine ? (physicsSettings ? physicsSettings.elasticity : 0.8) : 0.8;

				const fillInterval = setInterval(() => {
					if (added >= ballsToAdd) {
						clearInterval(fillInterval);
						document.getElementById("status").textContent = "Auto-fill Complete";
						return;
					}

					const x = Math.random() * (window.innerWidth - radius * 4) + radius * 2;
					const color = autofillColors[Math.floor(Math.random() * autofillColors.length)];

					const ball = Bodies.circle(x, -50, radius, {
						restitution: elasticity,
						friction: 0.001,
						density: 0.001,
						render: {
							fillStyle: color,
							strokeStyle: "#fff",
							lineWidth: 3
						}
					});

					Composite.add(engine.world, ball);
					balls.push(ball);
					updateBallCount();
					added++;
				}, interval);
			});

			// Toggle background (chroma key green / transparent)
			let isTransparent = false;
			const toggleBackground = () => {
				isTransparent = !isTransparent;
				document.body.classList.toggle("transparent", isTransparent);
			};

			document.getElementById("bg-toggle-btn").addEventListener("click", toggleBackground);

			// Toggle UI visibility
			const toggleUI = () => {
				document.body.classList.toggle("hidden-ui");
			};

			document.addEventListener("keydown", e => {
				if (e.key === "h" || e.key === "H") toggleUI();
			});

			// Window resize
			window.addEventListener("resize", () => {
				if (!render || !engine) return;

				const width = window.innerWidth;
				const height = window.innerHeight;

				render.canvas.width = width;
				render.canvas.height = height;
				render.options.width = width;
				render.options.height = height;

				Composite.remove(engine.world, ground);
				Composite.remove(engine.world, leftWall);
				Composite.remove(engine.world, rightWall);

				ground = Bodies.rectangle(width / 2, height + 10, width, 20, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				leftWall = Bodies.rectangle(-10, height / 2, 20, height, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				rightWall = Bodies.rectangle(width + 10, height / 2, 20, height, {
					isStatic: true,
					render: { fillStyle: "transparent" }
				});

				Composite.add(engine.world, [ground, leftWall, rightWall]);
				updateTargetCount();
			});

			initPhysics();
		</script>
	</body>
</html>
